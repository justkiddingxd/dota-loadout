<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Loadout — Dota 2 heroes in the browser</title>
  <meta name="description" content="Every Dota 2 hero rendered live in the browser, in any of the game's items: the game's hero shader, animations and particle effects. Open source, MIT.">
  <meta name="theme-color" content="#0e1215">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230e1215'/%3E%3Cpath d='M11 7v18h11' fill='none' stroke='%23e3b46a' stroke-width='3.4'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow+Semi+Condensed:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body data-attr="agi">
  <div class="app" data-app>
    <!-- The hero, over the whole screen; it rises when the wardrobe's sheet comes up. -->
    <main class="stage" data-stage>
      <div class="backdrop" aria-hidden="true"><div class="glow"></div><div class="floor"></div></div>
      <canvas class="view" data-view></canvas>
      <div class="status" data-status>
        <div class="bar-line"><i data-bar></i></div>
        <span data-status-text></span>
      </div>
      <p class="hint" data-hint></p>
    </main>

    <header class="top">
      <div class="hero-switch">
        <button class="step" type="button" data-prev aria-label="Previous hero">‹</button>
        <button class="switch" type="button" data-open-picker aria-haspopup="dialog">
          <img data-switch-icon alt="">
          <span class="switch-text">
            <small><img class="attr-icon" data-attr-icon alt=""><span data-attr-name></span></small>
            <b data-switch-name></b>
          </span>
          <kbd>/</kbd>
        </button>
        <button class="step" type="button" data-next aria-label="Next hero">›</button>
      </div>
      <nav class="top-tools">
        <button type="button" data-share></button>
        <button type="button" data-embed></button>
        <a href="https://github.com/justkiddingxd/dota-loadout" data-repo>GitHub</a>
        <button class="lang" type="button" data-lang-toggle>EN</button>
      </nav>
    </header>

    <nav class="anims" aria-label="Animations">
      <span class="label" data-t="animations"></span>
      <ul data-anims></ul>
    </nav>
    <button class="recenter" type="button" data-reset></button>
    <p class="toast" data-toast></p>

    <!-- The wardrobe: a dock of the slots, and a sheet of one slot's items above it. -->
    <section class="sheet" data-sheet hidden>
      <header class="sheet-head">
        <h2 data-sheet-title></h2>
        <span class="sheet-count" data-sheet-count></span>
        <label class="item-search"><input type="search" autocomplete="off" spellcheck="false" data-item-search></label>
        <div class="rarities" data-rarities></div>
        <button class="close" type="button" data-close-sheet aria-label="Close">×</button>
      </header>
      <div class="sheet-opts" data-sheet-opts></div>
      <div class="sheet-body" data-sheet-body></div>
    </section>
    <nav class="dock" data-dock aria-label="Wardrobe"></nav>
  </div>

  <div class="picker" data-picker hidden role="dialog" aria-modal="true" aria-label="Heroes">
    <div class="picker-inner">
      <header class="picker-head">
        <label class="search"><input type="search" autocomplete="off" spellcheck="false" data-search></label>
        <div class="attrs" role="group" data-attrs></div>
        <button class="close" type="button" data-close-picker aria-label="Close">×</button>
      </header>
      <div class="picker-body" data-list></div>
    </div>
  </div>

  <dialog class="embed" data-embed-dialog>
    <form method="dialog">
      <header>
        <h2 data-t="embedTitle"></h2>
        <button value="close" aria-label="Close">×</button>
      </header>
      <p data-t="embedText"></p>
      <pre><code data-embed-code></code></pre>
      <div class="embed-actions"><button type="button" data-copy></button></div>
      <p class="fine" data-t="embedFine"></p>
    </form>
  </dialog>

  <script type="module" src="./main.js"></script>
</body>
</html>
