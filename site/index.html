<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Loadout — Dota 2 heroes in the browser</title>
  <meta name="description" content="Every Dota 2 hero live in the browser, in any of the game's items: the game's hero shader, animations and particle effects. Open source, MIT.">
  <meta name="theme-color" content="#0f1923">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f1923'/%3E%3Cpath d='M11 7v18h11' fill='none' stroke='%23ece8e1' stroke-width='3.4'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Roboto+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="backdrop" data-backdrop hidden></div>
  <header class="title" data-title></header>
  <main class="stage"><canvas data-view></canvas><div class="loading" data-loading hidden><i data-bar></i></div></main>
  <svg class="leaders" data-leaders aria-hidden="true"></svg>
  <nav class="slots" data-slots aria-label="Слоты"></nav>
  <div class="now" data-now></div>
  <div class="tools" data-tools></div>
  <aside class="skins" data-side></aside>
  <div class="tip" data-tip hidden></div>
  <p class="toast" data-toast></p>
  <section class="roster" data-roster hidden></section>
  <dialog class="embed" data-embed></dialog>
  <script type="module" src="./app.js"></script>
</body>
</html>
