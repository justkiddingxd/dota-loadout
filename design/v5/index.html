<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Loadout — Кукла</title>
  <meta name="theme-color" content="#20262c">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@300;400;500;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/design/v5/style.css">
</head>
<body>
  <main class="stage">
    <canvas data-view></canvas>
    <svg class="leaders" data-leaders aria-hidden="true"></svg>
    <div class="callouts" data-callouts></div>
    <div class="loading" data-loading hidden><i data-bar></i></div>
  </main>
  <header class="top">
    <div class="title"><h1 data-name></h1><button class="change" type="button" data-change></button></div>
    <button class="share" type="button" data-share></button>
  </header>
  <nav class="other" data-other></nav>
  <div class="pop" data-pop hidden></div>
  <dialog class="heroes" data-heroes></dialog>
  <script type="module" src="/design/v5/app.js"></script>
</body>
</html>
