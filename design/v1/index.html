<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Loadout — Док</title>
  <meta name="theme-color" content="#0e1013">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/design/v1/style.css">
</head>
<body>
  <main class="scene"><canvas data-view></canvas></main>
  <header class="top">
    <button class="who" type="button" data-who aria-haspopup="dialog"></button>
    <div class="top-actions">
      <div class="anim" data-anim></div>
      <button class="ghost" type="button" data-share></button>
    </div>
  </header>
  <section class="rail" data-rail hidden aria-label="Предметы слота"></section>
  <nav class="dock" data-dock aria-label="Слоты"></nav>
  <div class="loading" data-loading hidden><i data-bar></i></div>
  <dialog class="palette" data-palette aria-label="Выбор героя"></dialog>
  <script type="module" src="/design/v1/app.js"></script>
</body>
</html>
