<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Loadout — Каталог</title>
  <meta name="theme-color" content="#ffffff">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Display:wght@500;600;700&family=Wix+Madefor+Text:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/design/v4/style.css">
</head>
<body>
  <header class="head">
    <a class="mark" href="/">Loadout</a>
    <button class="who" type="button" data-who aria-expanded="false"></button>
    <label class="find"><input type="search" data-q autocomplete="off" spellcheck="false"></label>
    <button class="share" type="button" data-share></button>
    <div class="heroes" data-heroes hidden></div>

  <div class="page">
    <nav class="filters" data-filters aria-label="Фильтры"></nav>

    <aside class="fitting">
      <div class="view"><canvas data-view></canvas><div class="loading" data-loading hidden><i data-bar></i></div></div>
      <div class="worn" data-worn></div>
    </aside>
  </div>
  <script type="module" src="/design/v4/app.js"></script>
