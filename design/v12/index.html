<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Loadout — Коллекция</title>
  <meta name="theme-color" content="#0f1923">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Roboto+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/design/v12/style.css">
</head>
<body>
  <main class="stage"><canvas data-view></canvas><div class="loading" data-loading hidden><i data-bar></i></div></main>
  <svg class="leaders" data-leaders aria-hidden="true"></svg>
  <nav class="slots" data-slots aria-label="Слоты"></nav>
  <header class="title" data-title></header>
  <div class="now" data-now></div>
  <aside class="skins" data-skins></aside>
  <div class="tip" data-tip hidden></div>
  <section class="roster" data-roster hidden></section>
  <script type="module" src="/design/v12/app.js"></script>
</body>
</html>
