<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Loadout — Лист персонажа</title>
  <meta name="theme-color" content="#20262c">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/design/v6/style.css">
</head>
<body>
  <main class="stage">
    <canvas data-view></canvas>
    <svg class="leaders" data-leaders aria-hidden="true"></svg>
    <div class="loading" data-loading hidden><i data-bar></i></div>
  </main>
  <header class="top">
    <button class="who" type="button" data-who></button>
    <div class="tools"><div class="anim" data-anim></div><button class="ghost" type="button" data-share></button></div>
  </header>
  <nav class="col left" data-col="left" aria-label="Слоты слева"></nav>
  <nav class="col right" data-col="right" aria-label="Слоты справа"></nav>
  <nav class="more" data-more aria-label="Прочие слоты"></nav>
  <section class="drawer" data-drawer hidden></section>
  <dialog class="heroes" data-heroes></dialog>
  <script type="module" src="/design/v6/app.js"></script>
</body>
</html>
