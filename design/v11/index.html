<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Loadout — Оружейная</title>
  <meta name="theme-color" content="#0b0e12">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Forum&family=Fira+Sans:wght@400;500;600&family=Fira+Sans+Condensed:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/design/v11/style.css">
</head>
<body>
  <div class="scene" data-scene></div>
  <main class="stage"><canvas data-view></canvas><div class="loading" data-loading hidden><i data-bar></i></div></main>
  <svg class="leaders" data-leaders aria-hidden="true"></svg>
  <header class="bar">
    <span class="logo">Loadout</span>
    <nav class="tabs" data-tabs></nav>
    <div class="bar-right"><button class="btn" type="button" data-share></button><button class="btn hero-btn" type="button" data-pick></button></div>
  </header>
  <aside class="loadout" data-loadout></aside>
  <aside class="inventory" data-inventory></aside>
  <footer class="foot"><div class="anim" data-anim></div><p data-hint></p></footer>
  <div class="trying" data-trying hidden></div>
  <div class="tip" data-tip hidden></div>
  <section class="grid-heroes" data-heroes hidden></section>
  <script type="module" src="/design/v11/app.js"></script>
</body>
</html>
