<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Loadout — Осмотр</title>
  <meta name="theme-color" content="#14181d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/design/v13/style.css">
</head>
<body>
  <main class="stage"><canvas data-view></canvas><div class="loading" data-loading hidden><i data-bar></i></div></main>
  <header class="top">
    <button class="who" type="button" data-pick></button>
    <nav class="cats" data-cats aria-label="Слоты"></nav>
    <button class="btn" type="button" data-share></button>
  </header>
  <section class="inspect" data-inspect></section>
  <section class="strip" data-strip aria-label="Предметы слота"></section>
  <div class="tip" data-tip hidden></div>
  <section class="inventory" data-inventory hidden></section>
  <section class="roster" data-roster hidden></section>
  <script type="module" src="/design/v13/app.js"></script>
</body>
</html>
