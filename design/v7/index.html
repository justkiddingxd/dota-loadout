<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Loadout — Указка</title>
  <meta name="theme-color" content="#17191d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/design/v7/style.css">
</head>
<body>
  <main class="stage">
    <canvas data-view></canvas>
    <svg class="leaders" data-leaders aria-hidden="true"></svg>
    <div class="tip" data-tip hidden></div>
    <p class="hint" data-hint></p>
    <div class="loading" data-loading hidden><i data-bar></i></div>
    <div class="stage-top"><button class="who" type="button" data-who></button><div class="tools"><div class="anim" data-anim></div><button class="pill" type="button" data-share></button></div></div>
  </main>
  <aside class="panel" data-panel></aside>
  <dialog class="heroes" data-heroes></dialog>
  <script type="module" src="/design/v7/app.js"></script>
</body>
</html>
